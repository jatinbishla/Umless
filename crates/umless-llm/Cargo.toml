[package]
name = "umless-llm"
description = "Local LLM runtime for Umless (llama.cpp): prefix-cached prompts and prompt-lookup decoding"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# GPU offload for the cleanup LLM on Windows and Linux (macOS always uses Metal).
# CPU is the default; build with e.g. `cargo build --release --features vulkan`.
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]
rocm = ["llama-cpp-2/rocm"]

[dependencies]
anyhow.workspace = true
log.workspace = true
llama-cpp-2 = "0.1.160"

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.160", features = ["metal"] }
