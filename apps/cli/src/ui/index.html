<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umless</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --side: #efeeeb; --text: #1c1c1e; --muted: #6e6e73;
    --line: #e4e3df; --accent: #4f46e5; --accent-soft: #eceafd; --ok: #1f9d55; --bad: #d23c3c;
    --hover: #f1f0ed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b1d; --panel: #232326; --side: #18181a; --text: #ececee; --muted: #9a9aa2;
      --line: #2f2f33; --accent: #8b85ff; --accent-soft: #2b2944; --ok: #3ccf7e; --bad: #ff6b6b;
      --hover: #2a2a2e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    background: var(--bg); color: var(--text); display: flex; -webkit-user-select: none;
  }
  nav {
    width: 220px; flex: none; background: var(--side); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; padding: 18px 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 22px; font-weight: 650; font-size: 16px; }
  .brand svg { color: var(--accent); }
  nav button {
    all: unset; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
    color: var(--muted); cursor: default; font-weight: 500;
  }
  nav button:hover { background: var(--hover); color: var(--text); }
  nav button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  nav .grow { flex: 1; }
  .status { display: flex; align-items: center; gap: 8px; padding: 10px; font-size: 12px; color: var(--muted); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.busy { background: var(--accent); }
  .dot.bad { background: var(--bad); }
  main { flex: 1; overflow-y: auto; padding: 34px 44px 60px; }
  h1 { font-size: 24px; margin: 0 0 4px; font-weight: 650; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 26px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 30px 0 10px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .stat .n { font-size: 26px; font-weight: 650; letter-spacing: -.02em; }
  .stat .l { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: flex; gap: 16px; padding: 12px 16px; border-top: 1px solid var(--line); position: relative; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--hover); }
  .time { color: var(--muted); font-size: 12px; width: 52px; flex: none; padding-top: 1px; font-variant-numeric: tabular-nums; }
  .body { flex: 1; min-width: 0; }
  .text { -webkit-user-select: text; white-space: pre-wrap; word-wrap: break-word; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }
  .heard { color: var(--muted); font-size: 12.5px; margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--line); -webkit-user-select: text; }
  .tag { background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 0 6px; font-size: 11.5px; font-weight: 600; }
  .actions { display: flex; gap: 4px; opacity: 0; transition: opacity .12s; align-self: flex-start; }
  .row:hover .actions { opacity: 1; }
  .btn {
    all: unset; padding: 5px 10px; border-radius: 7px; font-size: 12.5px; font-weight: 550;
    background: var(--panel); border: 1px solid var(--line); color: var(--text); cursor: default;
  }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); }
  .day { font-size: 12px; font-weight: 600; color: var(--muted); margin: 22px 0 8px; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 4px; }
  input[type=text], input[type=search] {
    font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; outline: none; -webkit-user-select: text; flex: 1;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .chip { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 6px 5px 12px; }
  .chip button { all: unset; width: 18px; height: 18px; border-radius: 50%; text-align: center; line-height: 17px; color: var(--muted); }
  .chip button:hover { background: var(--hover); color: var(--bad); }
  .empty { color: var(--muted); padding: 36px 16px; text-align: center; }
  .kv { display: grid; grid-template-columns: 180px 1fr; gap: 10px 16px; align-items: center; }
  .kv .k { color: var(--muted); }
  kbd { font: 12px ui-monospace, monospace; background: var(--hover); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; }
  .ok { color: var(--ok); font-weight: 600; } .no { color: var(--bad); font-weight: 600; }
  .seg { display: inline-flex; background: var(--hover); border: 1px solid var(--line); border-radius: 9px; padding: 2px; gap: 2px; flex-wrap: wrap; }
  .seg button { all: unset; padding: 5px 12px; border-radius: 7px; font-size: 13px; font-weight: 550; color: var(--muted); }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .styles { margin-top: 12px; display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: 13px; }
  .styles .k { font-weight: 600; }
  .switch { position: relative; width: 36px; height: 20px; background: var(--line); border-radius: 999px; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .switch.on { background: var(--accent); } .switch.on::after { left: 18px; }
  .stack > .card + .card { margin-top: 12px; }
  .card h3 { margin: 0 0 12px; font-size: 14px; }
  .note { color: var(--muted); font-size: 12.5px; margin-top: 10px; }
  .steps { display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; gap: 14px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
  .step.done { opacity: .72; }
  .badge { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; background: var(--hover); color: var(--muted); }
  .step.done .badge { background: var(--ok); color: #fff; }
  .step .what { flex: 1; }
  .step .title { font-weight: 600; }
  .step .why { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .step .more { font-size: 12.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .step .side { display: flex; gap: 6px; flex: none; align-self: center; }
  .progress { height: 6px; background: var(--hover); border-radius: 99px; overflow: hidden; margin: 0 0 22px; }
  .progress div { height: 100%; background: var(--accent); transition: width .3s; }
  textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-height: 64px; resize: vertical; outline: none; margin-top: 10px; -webkit-user-select: text; }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: .92; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<nav>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 18 18" aria-hidden="true">
      <g fill="currentColor"><rect x="1.3" y="1.5" width="2.4" height="15" rx="1.2"/><rect x="4.8" y="1.5" width="2.4" height="8" rx="1.2"/><rect x="8.3" y="1.5" width="2.4" height="12" rx="1.2"/><rect x="11.8" y="1.5" width="2.4" height="8" rx="1.2"/><rect x="15.3" y="1.5" width="2.4" height="15" rx="1.2"/></g>
    </svg>
    Umless
  </div>
  <button data-page="setup" id="nav-setup" hidden>Setup</button>
  <button data-page="home" class="on">Home</button>
  <button data-page="history">History</button>
  <button data-page="dictionary">Dictionary</button>
  <button data-page="settings">Settings</button>
  <div class="grow"></div>
  <div class="status"><span class="dot" id="dot"></span><span id="status">Ready · hold Fn to dictate</span></div>
</nav>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
// The hold key and OS, from the backend ('setup'): Fn on macOS, Ctrl + Win (or the
// configured key) on Windows and Linux.
let K = { os: 'macos', hold: 'fn', cmd: 'control' };
const mac = () => K.os === 'macos';
window.umless = {
  _n: 0, _pending: {},
  call(cmd, args = {}) {
    const id = ++this._n;
    return new Promise((resolve, reject) => {
      this._pending[id] = { resolve, reject };
      window.webkit.messageHandlers.umless.postMessage(JSON.stringify({ id, cmd, args }));
    });
  },
  _reply(r) {
    const p = this._pending[r.id];
    if (!p) return;
    delete this._pending[r.id];
    r.error ? p.reject(new Error(r.error)) : p.resolve(r.result);
  },
  _event(name, status) {
    const dot = document.getElementById('dot');
    dot.className = 'dot' + (name === 'error' ? ' bad' : /Listening|Writing|Loading/.test(status) ? ' busy' : '');
    document.getElementById('status').textContent = status === 'Ready' ? `Ready · hold ${mac() ? 'Fn' : K.hold} to dictate` : status;
    if (name === 'typed' && (page === 'home' || page === 'history')) show(page);
    if (name === 'setup' && page !== 'setup') show('setup');
  },
};

const $ = (tag, props = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid);
  return el;
};
const main = document.getElementById('main');
const STYLE_LABELS = { auto: 'Auto', clean: 'Clean', formal: 'Formal', casual: 'Casual', prompt: 'AI prompt' };
let page = 'home';

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1600);
}
const fmtNum = n => n >= 10000 ? (n / 1000).toFixed(1) + 'k' : n.toLocaleString();
const fmtTime = ms => new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
function dayLabel(ms) {
  const d = new Date(ms), today = new Date();
  const days = Math.round((new Date(today.toDateString()) - new Date(d.toDateString())) / 864e5);
  if (days === 0) return 'Today';
  if (days === 1) return 'Yesterday';
  return d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
}
function fmtMinutes(m) { return m < 60 ? `${m} min` : `${(m / 60).toFixed(1)} h`; }

function entryRow(e, { actions = true } = {}) {
  const heard = $('div', { class: 'heard' }, 'Heard: ' + e.raw);
  heard.hidden = true;
  const meta = $('div', { class: 'meta' },
    e.app ? $('span', { class: 'tag' }, e.app) : null,
    e.mode === 'command' ? $('span', { class: 'tag' }, 'command') : null,
    e.style && e.style !== 'clean' ? $('span', { class: 'tag' }, STYLE_LABELS[e.style] || e.style) : null,
    $('span', {}, `${e.spoke_secs.toFixed(1)} s spoken`),
    $('span', {}, `${e.latency_ms} ms to type`));
  const row = $('div', { class: 'row' },
    $('div', { class: 'time' }, fmtTime(e.at)),
    $('div', { class: 'body' }, $('div', { class: 'text' }, e.text), meta, heard));
  if (actions) {
    row.append($('div', { class: 'actions' },
      $('button', { class: 'btn', onclick: async () => { await umless.call('copy', { text: e.text }); toast('Copied'); } }, 'Copy'),
      e.raw !== e.text ? $('button', { class: 'btn', onclick: () => { heard.hidden = !heard.hidden; } }, 'Heard') : null,
      $('button', { class: 'btn danger', onclick: async () => { await umless.call('delete', { at: e.at }); row.remove(); } }, 'Delete')));
  }
  return row;
}

let setupTimer = null, triedIt = false;
const pages = {
  async setup() {
    const s = await umless.call('setup');
    const fnOk = s.fn_key === 'nothing';
    const steps = [
      { done: s.mic === 'granted', title: 'Microphone', why: `So Umless can hear you while you hold ${K.hold}.`,
        action: s.mic === 'denied'
          ? ['Open Microphone settings', () => umless.call('request', { what: 'mic_settings' })]
          : ['Allow', () => umless.call('request', { what: 'mic' })],
        more: s.mic === 'denied' ? 'macOS remembers a "Don\'t Allow". Turn Umless on in the list that opens.' : null },
      mac() ? { done: s.accessibility, title: 'Accessibility', why: 'So Umless can type the text where your cursor is.',
        action: ['Allow', () => umless.call('request', { what: 'accessibility' })],
        more: 'In the list that opens, turn on Umless.', reset: 'accessibility' }
      : { done: s.accessibility, title: 'Typing tools', why: 'So Umless can paste the text where your cursor is.',
        action: ['Check again', () => umless.call('request', { what: 'accessibility' })],
        more: s.wayland ? 'Install wl-clipboard and wtype (on GNOME: ydotool, with ydotoold running), e.g. sudo apt install wl-clipboard wtype ydotool'
                        : 'Install xclip and xdotool, e.g. sudo apt install xclip xdotool' },
      mac() ? { done: s.input_monitoring, title: 'Input Monitoring', why: 'So Umless can see when you hold the fn key.',
        action: ['Allow', () => umless.call('request', { what: 'input_monitoring' })],
        more: 'Turn on Umless, then restart it. macOS applies this one only after a restart.',
        restart: true, reset: 'input_monitoring' }
      : { done: s.input_monitoring, title: 'Keyboard access', why: `So Umless can see when you hold ${K.hold}.`,
        action: ['Check again', () => umless.call('request', { what: 'input_monitoring' })],
        more: 'Run: sudo usermod -aG input $USER, then log out and back in, and restart Umless.', restart: true },
      { done: fnOk, title: 'Make fn do nothing else', why: 'Set "Press 🌐 key to" to "Do Nothing", so fn doesn\'t also open the emoji picker.',
        action: ['Open Keyboard settings', () => umless.call('request', { what: 'keyboard' })] },
    ];
    const needed = steps.filter(x => !x.done).length;
    const done = steps.length - needed + (triedIt ? 1 : 0);
    const total = steps.length + 1;
    const list = $('div', { class: 'steps' });
    steps.forEach((st, i) => {
      const more = $('div', { class: 'more' });
      if (!st.done && st.more) more.append(st.more);
      if (!st.done && st.restart) more.append($('button', { class: 'btn', onclick: () => umless.call('restart') }, 'Restart Umless'));
      if (!st.done && st.reset) more.append($('button', { class: 'btn', title: 'For an entry left over from an older Umless build', onclick: async () => {
        await umless.call('reset_permission', { what: st.reset }); await umless.call('request', { what: st.reset });
        toast('Old entry cleared. Turn Umless on again.');
      } }, 'On but still not allowed? Reset'));
      list.append($('div', { class: 'step' + (st.done ? ' done' : '') },
        $('div', { class: 'badge' }, st.done ? '✓' : String(i + 1)),
        $('div', { class: 'what' }, $('div', { class: 'title' }, st.title), $('div', { class: 'why' }, st.why), more.childNodes.length ? more : null),
        st.done ? null : $('div', { class: 'side' }, $('button', { class: 'btn primary', onclick: st.action[1] }, st.action[0]))));
    });
    const ready = s.done;
    const box = $('textarea', { placeholder: ready ? `Click here, hold ${K.hold} and say "Hello Umless, this is working."` : 'Finish the steps above first.' });
    if (!ready) box.disabled = true;
    box.addEventListener('input', () => { if (box.value.trim().length > 3 && !triedIt) { triedIt = true; toast('It works 🎉'); show('setup'); } });
    list.append($('div', { class: 'step' + (triedIt ? ' done' : '') },
      $('div', { class: 'badge' }, triedIt ? '✓' : String(steps.length + 1)),
      $('div', { class: 'what' }, $('div', { class: 'title' }, 'Try it'),
        $('div', { class: 'why' }, `Hold ${K.hold} anywhere, speak, and let go.`), triedIt ? null : box)));
    clearTimeout(setupTimer);
    // Re-check every second while the user is in System Settings.
    if (!(ready && fnOk && triedIt)) setupTimer = setTimeout(() => { if (page === 'setup' && document.activeElement !== box) show('setup'); }, 1000);
    document.getElementById('nav-setup').hidden = ready && fnOk;
    return [
      $('h1', {}, needed ? 'Set up Umless' : triedIt ? 'You\'re all set' : 'Almost there'),
      $('p', { class: 'sub' }, needed
        ? (mac() ? 'macOS asks you to allow a few things once.' : 'Umless needs a few things set up once.') + ' Each step turns green as soon as it\'s done.'
        : `Everything is allowed. Try it below, then hold ${K.hold} anywhere you type.`),
      $('div', { class: 'progress' }, $('div', { style: `width:${Math.round(100 * done / total)}%` })),
      list,
      !needed && triedIt ? $('p', { class: 'note' }, $('a', { href: '#', onclick: ev => { ev.preventDefault(); show('home'); } }, 'Go to Home →')) : null,
    ];
  },

  async home() {
    const { stats: s, recent } = await umless.call('home');
    const stat = (n, l) => $('div', { class: 'card stat' }, $('div', { class: 'n' }, n), $('div', { class: 'l' }, l));
    return [
      $('h1', {}, 'Welcome back'),
      $('p', { class: 'sub' }, 'Hold ', $('kbd', {}, K.hold), ' anywhere, speak, and let go. Your words appear where your cursor is.'),
      $('div', { class: 'grid' },
        stat(fmtNum(s.words), 'words dictated'),
        stat(fmtNum(s.words_week), 'words this week'),
        stat(s.wpm ? `${s.wpm} wpm` : '—', 'speaking speed'),
        stat(fmtMinutes(s.saved_min), 'saved vs typing')),
      $('h2', {}, 'Recent'),
      recent.length
        ? $('div', { class: 'list' }, recent.map(e => entryRow(e)))
        : $('div', { class: 'list' }, $('div', { class: 'empty' }, `Nothing yet. Hold ${K.hold} and say something.`)),
      recent.length ? $('p', { class: 'note' }, $('a', { href: '#', onclick: ev => { ev.preventDefault(); show('history'); } }, 'See all history →')) : null,
    ];
  },

  async history() {
    const entries = await umless.call('history');
    const list = $('div');
    const render = q => {
      list.replaceChildren();
      const shown = q ? entries.filter(e => (e.text + ' ' + e.raw).toLowerCase().includes(q.toLowerCase())) : entries;
      if (!shown.length) { list.append($('div', { class: 'empty' }, q ? 'No matches.' : 'No dictations yet.')); return; }
      let day = null, group = null;
      for (const e of shown) {
        const d = dayLabel(e.at);
        if (d !== day) { day = d; list.append($('div', { class: 'day' }, d)); group = $('div', { class: 'list' }); list.append(group); }
        group.append(entryRow(e));
      }
    };
    render('');
    return [
      $('h1', {}, 'History'),
      $('p', { class: 'sub' }, `${entries.length.toLocaleString()} dictations, kept only on this Mac.`),
      $('div', { class: 'toolbar' },
        $('input', { type: 'search', placeholder: 'Search what you said…', oninput: ev => render(ev.target.value) }),
        $('button', { class: 'btn danger', onclick: async () => {
          if (!entries.length || !confirm('Delete all history? This can\'t be undone.')) return;
          await umless.call('clear'); show('history');
        } }, 'Clear all')),
      list,
    ];
  },

  async dictionary() {
    let terms = await umless.call('dictionary');
    const chips = $('div', { class: 'chips' });
    const render = () => {
      chips.replaceChildren();
      if (!terms.length) chips.append($('div', { class: 'empty', style: 'width:100%' }, 'Add names, products and jargon you say often.'));
      for (const t of terms) chips.append($('div', { class: 'chip' }, t,
        $('button', { title: 'Remove', onclick: async () => { terms = await umless.call('dict_remove', { term: t }); render(); } }, '×')));
    };
    const input = $('input', { type: 'text', placeholder: 'e.g. SubFlo, Jatin Bishla, lien waivers' });
    const add = async () => {
      const term = input.value.trim();
      if (!term) return;
      try { terms = await umless.call('dict_add', { term }); input.value = ''; render(); toast(`Added "${term}"`); }
      catch (err) { toast(err.message); }
    };
    input.addEventListener('keydown', ev => { if (ev.key === 'Enter') add(); });
    render();
    setTimeout(() => input.focus(), 0);
    return [
      $('h1', {}, 'Dictionary'),
      $('p', { class: 'sub' }, 'Words Umless should always spell your way. If the speech model hears "Subflow", it types "SubFlo". Changes apply to your next dictation.'),
      $('div', { class: 'toolbar' }, input, $('button', { class: 'btn primary', onclick: add }, 'Add')),
      chips,
    ];
  },

  async settings() {
    const s = await umless.call('settings');
    const st = await umless.call('style');
    const tiers = await umless.call('tiers');
    const tierSeg = $('div', { class: 'seg' });
    for (const t of tiers) {
      const b = $('button', { class: t.current ? 'on' : '', title: t.installed ? `${t.speech} + ${t.cleanup}` : 'Not downloaded' },
        t.name[0].toUpperCase() + t.name.slice(1) + (t.installed ? '' : ' ↓'));
      b.addEventListener('click', async () => {
        if (t.current) return;
        try { toast(`Switching to ${t.name}…`); await umless.call('set_tier', { tier: t.name }); }
        catch (err) { toast(err.message); }
      });
      tierSeg.append(b);
    }
    const seg = $('div', { class: 'seg' });
    for (const [key, label] of Object.entries(STYLE_LABELS)) {
      const b = $('button', { class: key === st.current ? 'on' : '' }, label);
      b.addEventListener('click', async () => {
        await umless.call('set_style', { style: key });
        seg.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
        toast(key === 'auto' ? 'Style follows the app you type into' : `Always ${label}`);
      });
      seg.append(b);
    }
    const yes = ok => $('span', { class: ok ? 'ok' : 'no' }, ok ? 'Allowed' : 'Not allowed');
    const toggle = (cmd, on) => {
      const el = $('div', { class: 'switch' + (on ? ' on' : '') });
      el.addEventListener('click', async () => {
        try { el.classList.toggle('on', await umless.call(cmd, { on: !el.classList.contains('on') })); }
        catch (err) { toast(err.message); }
      });
      return el;
    };
    const sw = toggle('set_login', s.login);
    const open = what => $('button', { class: 'btn', onclick: () => umless.call('open', { what }) },
      { dictionary: 'Open dictionary file', history: 'Show history file', log: 'Open log', privacy: 'Open Privacy settings' }[what]);
    return [
      $('h1', {}, 'Settings'),
      $('p', { class: 'sub' }, 'Everything runs on this Mac. Nothing you say leaves it.'),
      $('div', { class: 'stack' },
        $('div', { class: 'card' }, $('h3', {}, 'Shortcuts'), $('div', { class: 'kv' },
          $('div', { class: 'k' }, 'Dictate'), $('div', {}, 'Hold ', $('kbd', {}, K.hold), ', speak, let go'),
          $('div', { class: 'k' }, 'Command mode'), $('div', {}, 'Hold ', $('kbd', {}, K.hold), ' + ', $('kbd', {}, K.cmd), ' and say what to write: \u201creply saying I\u2019ll send it Friday\u201d, or select text and say \u201cmake this shorter\u201d'),
          $('div', { class: 'k' }, 'Cancel'), $('div', {}, 'Press any other key while holding ', $('kbd', {}, K.hold)))),
        $('div', { class: 'card' }, $('h3', {}, 'Writing style'), seg,
          $('div', { class: 'styles' },
            $('div', { class: 'k' }, 'Auto'), $('div', {}, 'Picks one from the app you\'re typing into.'),
            $('div', { class: 'k' }, 'AI prompt'), $('div', {}, 'Claude, ChatGPT, Codex, Cursor, terminals: a clear, structured prompt.'),
            $('div', { class: 'k' }, 'Formal'), $('div', {}, 'Mail, Gmail, Outlook, Teams, LinkedIn: polished, professional sentences.'),
            $('div', { class: 'k' }, 'Casual'), $('div', {}, 'Slack, WhatsApp, Messages, Discord: your own voice, just cleaned.'),
            $('div', { class: 'k' }, 'Clean'), $('div', {}, 'Everywhere else: fillers and false starts removed, nothing else changed.')),
          st.lite ? $('p', { class: 'note' }, 'On the Lite tier, Formal and AI prompt use Clean for now; Lite\'s small model can\'t rewrite safely yet.') : null),
        $('div', { class: 'card' }, $('h3', {}, 'General'), $('div', { class: 'kv' },
          $('div', { class: 'k' }, 'Launch at login'), sw,
          $('div', { class: 'k' }, 'Use what\u2019s on screen'), toggle('set_screen_context', s.screen_context),
          $('div', { class: 'k' }, 'Learn from my corrections'), toggle('set_learning', s.learning)),
          $('p', { class: 'note' }, (mac() ? '' : 'Windows and Linux: Umless reads only the app and window title for now. ') + 'Screen: Umless reads the text around your cursor (the email thread, the chat) to spell names right, match the conversation\u2019s tone, and give command mode context. It stays on this ' + (mac() ? 'Mac' : 'computer') + ' and is never saved. Corrections: when you fix a name Umless typed, it adds your spelling to the dictionary.')),
        $('div', { class: 'card' }, $('h3', {}, 'Models'), tierSeg, $('div', { class: 'kv', style: 'margin-top:12px' },
          $('div', { class: 'k' }, 'Speech'), $('div', {}, s.speech),
          $('div', { class: 'k' }, 'Cleanup'), $('div', {}, s.cleanup)),
          $('p', { class: 'note' }, 'Lite is fastest and smallest, Max most accurate. Switching restarts Umless. Tiers marked ↓ aren\'t downloaded: run ./install.sh <tier> in the Umless folder.')),
        $('div', { class: 'card' }, $('h3', {}, 'Permissions'), $('div', { class: 'kv' },
          $('div', { class: 'k' }, 'Input Monitoring'), yes(s.input_monitoring),
          $('div', { class: 'k' }, 'Accessibility'), yes(s.accessibility)),
          $('p', { class: 'note' }, 'Input Monitoring lets Umless see the fn key; Accessibility lets it type for you.'),
          $('div', { style: 'margin-top:10px' }, open('privacy'))),
        $('div', { class: 'card' }, $('h3', {}, 'Your data'),
          $('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, open('dictionary'), open('history'), open('log')),
          $('p', { class: 'note' }, `Umless ${s.version}`))),
    ];
  },
};

async function show(name) {
  page = name;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.page === name));
  try { main.replaceChildren(...(await pages[name]()).filter(Boolean)); }
  catch (err) { main.replaceChildren($('div', { class: 'empty' }, 'Something went wrong: ' + err.message)); }
  main.scrollTop = 0;
}
document.querySelectorAll('nav button').forEach(b => b.addEventListener('click', () => show(b.dataset.page)));
// Open on Setup until everything is allowed.
umless.call('setup').then(s => {
  K = { os: s.os || 'macos', hold: s.hold_key || 'fn', cmd: s.command_key || 'control' };
  document.getElementById('status').textContent = `Ready · hold ${mac() ? 'Fn' : K.hold} to dictate`;
  const pending = !s.done || s.fn_key !== 'nothing';
  document.getElementById('nav-setup').hidden = !pending;
  show(pending ? 'setup' : 'home');
}).catch(() => show('home'));
</script>
</body>
</html>
