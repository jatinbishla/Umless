[package]
name = "umless-cli"
description = "Umless from the terminal: app (hold Fn to dictate), listen, transcribe, bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "umless"
path = "src/main.rs"

[features]
default = ["gui"]
# The tray icon, window and pill on Windows and Linux (macOS always has its own).
# Build a headless Linux CLI without GTK/WebKitGTK with --no-default-features.
gui = ["umless-shell/gui"]
# GPU offload for the LLM on Windows/Linux: needs the CUDA toolkit, the Vulkan SDK or ROCm.
cuda = ["umless-llm/cuda"]
vulkan = ["umless-llm/vulkan"]
rocm = ["umless-llm/rocm"]

[dependencies]
umless-audio.workspace = true
umless-asr.workspace = true
umless-eval.workspace = true
umless-models.workspace = true
umless-llm.workspace = true
umless-cleanup.workspace = true
umless-hotkey.workspace = true
umless-insert.workspace = true
umless-shell.workspace = true
umless-context.workspace = true
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
log.workspace = true
env_logger.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
