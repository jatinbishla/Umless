name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake clang libclang-dev pkg-config libasound2-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # sherpa-onnx downloads its prebuilt libraries into target/sherpa-onnx-prebuilt. The
      # cache restores that folder without the library files, and the build script trusts
      # any folder it finds: drop both and let it download again (~30-100 MB).
      - name: Refresh sherpa-onnx libraries
        shell: bash
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean --release -p sherpa-onnx-sys

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Headless CLI (no GTK)
        if: runner.os == 'Linux'
        run: cargo check --release --locked -p umless-cli --no-default-features

      - name: Installer syntax
        shell: bash
        run: |
          bash -n install.sh
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command '$e=$null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1",[ref]$null,[ref]$e) | Out-Null; if ($e) { $e; exit 1 }'
          fi

      - name: CLI smoke test
        shell: bash
        run: |
          ./target/release/umless --help
          ./target/release/umless models list || true

      # Loads the speech model and the LLM in one process, as every command does.
      # (The full three-tier bench runs in the Tiers workflow.)
      - name: Lite end to end
        shell: bash
        run: |
          ./target/release/umless models install lite
          echo "um so I think we should uh ship it on friday" | ./target/release/umless --tier lite clean
          ./target/release/umless --tier lite transcribe "$(ls models/*/test_wavs/*.wav | head -1)"
