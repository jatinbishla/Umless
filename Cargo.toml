[workspace]
resolver = "3"
members = ["crates/*", "apps/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jatinbishla/Umless"

[workspace.dependencies]
umless-audio = { path = "crates/umless-audio" }
umless-asr = { path = "crates/umless-asr" }
umless-eval = { path = "crates/umless-eval" }
umless-models = { path = "crates/umless-models" }
umless-llm = { path = "crates/umless-llm" }
umless-cleanup = { path = "crates/umless-cleanup" }
umless-hotkey = { path = "crates/umless-hotkey" }
umless-insert = { path = "crates/umless-insert" }
umless-shell = { path = "crates/umless-shell", default-features = false }
umless-context = { path = "crates/umless-context" }
anyhow = "1.0"
thiserror = "2"
cpal = "0.18"
rtrb = "0.4"
crossbeam-channel = "0.5"
hound = "3.5"
clap = { version = "4.6", features = ["derive", "env"] }
# Linked statically except on Windows, where its prebuilt static libs use the static C
# runtime (/MT) and llama.cpp the dynamic one (/MD): see the crates' target sections.
sherpa-onnx = { version = "2.0.1", default-features = false }
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
